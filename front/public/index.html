<body class="login-page bg-body-secondary">
    <div class="login-box">
        <div class="login-logo">
            Gestor documentario MDCH - OECE
        </div>
        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Inicia sesión</p>
                <form id="formulario_login">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="usuario" placeholder="Nombre de usuario">
                        <div class="input-group-text">
                            <i class="bi bi-person-circle"></i>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" class="form-control" id="contrasenia" placeholder="Contraseña">
                        <div class="input-group-text">
                            <span class="bi bi-lock-fill"></span>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Iniciar sesión</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
